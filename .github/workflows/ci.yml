name: CI

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build (esbuild bundle)
        run: pnpm build

      - name: Check bundle size (must be < 500KB)
        run: |
          SIZE=$(du -sk dist/ 2>/dev/null | cut -f1 || echo 0)
          echo "Bundle size: ${SIZE}KB"
          [ "$SIZE" -lt 500 ] || (echo "Bundle too large: ${SIZE}KB >= 500KB" && exit 1)
